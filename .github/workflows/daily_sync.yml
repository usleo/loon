name: Daily Sync Loon Plugin

on:
  schedule:
    - cron: '0 20 * * *'  # 每天北京时间早晨 4:00 自动跑
  workflow_dispatch:      # 允许手动点按钮立即运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 合并规则
        run: python merge.py

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add all_in_one.plugin
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "Auto sync: 更新聚合规则"
            git push
          fi
